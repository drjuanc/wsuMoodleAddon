<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>WSU Moodle Helper</title>
  <style>
    :root {
      --maroon: #5c1a1b;
      --gold: #c8892f;
      --bg: #ffffff;
      --text: #1f1a1a;
      --muted: #6b6262;
      --line: #e6dfdc;
      --track: #c9c2bf;
      --on: var(--maroon);
      --link: var(--maroon);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1b1b;
        --text: #f1ecea;
        --muted: #aaa09d;
        --line: #3a3333;
        --track: #5a5151;
        --on: var(--gold);
        --link: var(--gold);
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 280px;
      margin: 0;
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--maroon);
      color: #fff;
      border-bottom: 3px solid var(--gold);
      font-weight: 600;
      font-size: 14px;
    }
    header img { width: 22px; height: 22px; }
    main { padding: 4px 14px; }
    .row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      cursor: pointer;
    }
    .row + .row { border-top: 1px solid var(--line); }
    .text { flex: 1; }
    .title { display: block; font-weight: 600; }
    .hint { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }

    input[role="switch"] {
      appearance: none;
      flex: none;
      position: relative;
      width: 34px;
      height: 20px;
      margin: 1px 0 0;
      border-radius: 10px;
      background: var(--track);
      cursor: pointer;
      transition: background 0.15s;
    }
    input[role="switch"]::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.3);
      transition: transform 0.15s;
    }
    input[role="switch"]:checked { background: var(--on); }
    input[role="switch"]:checked::before { transform: translateX(14px); }
    input[role="switch"]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    footer {
      display: flex;
      justify-content: space-between;
      padding: 8px 14px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      color: var(--muted);
    }
    footer a { color: var(--link); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="">
    <span id="name">WSU Moodle Helper</span>
  </header>
  <main>
    <label class="row">
      <span class="text">
        <span class="title">Hide 'Chat to Wale' widget</span>
        <span class="hint">Stops the floating chat button covering Moodle's own buttons.</span>
      </span>
      <input type="checkbox" role="switch" id="hideChat">
    </label>
    <label class="row">
      <span class="text">
        <span class="title">Clean text pasted from Word</span>
        <span class="hint">Strips Word formatting when you paste into a Moodle editor. Images paste as normal.</span>
      </span>
      <input type="checkbox" role="switch" id="cleanPaste">
    </label>
  </main>
  <footer>
    <span id="version"></span>
    <a href="https://github.com/drjuanc/wsuMoodleAddon" target="_blank" rel="noopener">GitHub</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
